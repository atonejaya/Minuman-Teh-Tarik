name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main, master, "feature/**"]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  # ─── Lint & Unit Tests ──────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Run unit tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
          JWT_SECRET: ci-test-secret-key-not-for-production
          JWT_EXPIRES_IN: 1h
          PORT: "3001"

  # ─── Integration Tests ──────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run if TEST_DATABASE_URL secret is configured
    if: ${{ secrets.TEST_DATABASE_URL != '' }}
    needs: test-unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
          JWT_SECRET: ci-test-secret-key-not-for-production
          JWT_EXPIRES_IN: 1h
          PORT: "3001"
        timeout-minutes: 10

  # ─── Docker Build Validation ─────────────────────────────────────────────────
  docker-build:
    name: Docker Build (Validation)
    runs-on: ubuntu-latest
    needs: test-unit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t minuman-backend:ci .
        working-directory: backend

      - name: Verify image starts (smoke test)
        run: |
          docker run -d \
            --name backend-smoke \
            -e NODE_ENV=production \
            -e DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/db" \
            -e DIRECT_URL="postgresql://placeholder:placeholder@localhost:5432/db" \
            -e JWT_SECRET="ci-smoke-test-secret" \
            -e JWT_EXPIRES_IN="1h" \
            -e CORS_ORIGIN="http://localhost:3000" \
            -e PORT="3000" \
            -p 3000:3000 \
            minuman-backend:ci || true
          # Note: will exit due to DB connection failure — that's expected.
          # We only validate the image builds and starts without import errors.
          docker rm -f backend-smoke 2>/dev/null || true
        working-directory: backend
