openapi: 3.0.0
info:
  title: Master Data API
  description: API for managing Regional, Area, Route, Customer Category, and Customer Master Data
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  # --- Regional Endpoints ---
  /api/v1/master/regional:
    get:
      summary: Get all regionals
      tags: [Regional]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_List_Regional'
    post:
      summary: Create a regional
      tags: [Regional]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionalInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Regional'

  /api/v1/master/regional/{id}:
    get:
      summary: Get a regional by ID
      tags: [Regional]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Regional'
    put:
      summary: Update a regional
      tags: [Regional]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegionalInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Regional'

  /api/v1/master/regional/{id}/status:
    put:
      summary: Update regional status
      tags: [Regional]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Regional'

  # --- Area Endpoints ---
  /api/v1/master/area:
    get:
      summary: Get all areas
      tags: [Area]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_List_Area'
    post:
      summary: Create an area
      tags: [Area]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Area'

  /api/v1/master/area/{id}:
    get:
      summary: Get an area by ID
      tags: [Area]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Area'
    put:
      summary: Update an area
      tags: [Area]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Area'

  /api/v1/master/area/{id}/status:
    put:
      summary: Update area status
      tags: [Area]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Area'

  # --- Route Endpoints ---
  /api/v1/master/route:
    get:
      summary: Get all routes
      tags: [Route]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_List_Route'
    post:
      summary: Create a route
      tags: [Route]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Route'

  /api/v1/master/route/{id}:
    get:
      summary: Get a route by ID
      tags: [Route]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Route'
    put:
      summary: Update a route
      tags: [Route]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Route'

  /api/v1/master/route/{id}/status:
    put:
      summary: Update route status
      tags: [Route]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Route'

  # --- Customer Category Endpoints ---
  /api/v1/master/category:
    get:
      summary: Get all customer categories
      tags: [CustomerCategory]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_List_Category'
    post:
      summary: Create a customer category
      tags: [CustomerCategory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Category'

  /api/v1/master/category/{id}:
    get:
      summary: Get a customer category by ID
      tags: [CustomerCategory]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Category'
    put:
      summary: Update a customer category
      tags: [CustomerCategory]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Category'

  /api/v1/master/category/{id}/status:
    put:
      summary: Update customer category status
      tags: [CustomerCategory]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
