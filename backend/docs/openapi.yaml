components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Entity ID

  schemas:
    # Basic inputs
    StatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
      required:
        - status

    RegionalInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    AreaInput:
      type: object
      properties:
        regionalId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - regionalId
        - code
        - name

    RouteInput:
      type: object
      properties:
        areaId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - areaId
        - code
        - name

    CategoryInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    CustomerInput:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address:
          type: string
        contact:
          type: string
      required:
        - routeId
        - categoryId
        - code
        - name

    BrandInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    PackagingInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    UnitInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    ProductCategoryInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    ProductInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        barcode:
          type: string
        sku:
          type: string
        display_name:
          type: string
        search_keywords:
          type: string
        is_purchasable:
          type: boolean
        is_consignment:
          type: boolean
        shelf_life_days:
          type: integer
        average_cost:
          type: number
        last_purchase_price:
          type: number
        brand_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        packaging_id:
          type: string
          format: uuid
        unit_id:
          type: string
          format: uuid
        cost_price:
          type: number
        supplier_id:
          type: string
          format: uuid
        tax_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
      required:
        - code
        - name
        - brand_id
        - category_id
        - packaging_id
        - unit_id

    ProductPriceInput:
      type: object
      properties:
        price_level_id:
          type: string
          format: uuid
        price:
          type: number
        effective_from:
          type: string
          format: date-time
        effective_until:
          type: string
          format: date-time
      required:
        - price_level_id
        - price
        - effective_from

    SupplierInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        address:
          type: string
        contact:
          type: string
        pic_name:
          type: string
        phone:
          type: string
        email:
          type: string
        city:
          type: string
        province:
          type: string
      required:
        - code
        - name

    TaxInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        rate:
          type: number
        is_default:
          type: boolean
      required:
        - code
        - name
        - rate

    PriceLevelInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        priority:
          type: integer
      required:
        - code
        - name

    WarehouseInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        address:
          type: string
      required:
        - code
        - name

    # Entities
    Regional:
      allOf:
        - $ref: '#/components/schemas/RegionalInput'
