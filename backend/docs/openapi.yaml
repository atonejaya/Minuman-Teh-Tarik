            schema:
              $ref: '#/components/schemas/StatusInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Category'

  # --- Customer Endpoints ---
  /api/v1/master/customers:
    get:
      summary: Get all customers
      tags: [Customer]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_List_Customer'
    post:
      summary: Create a customer
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Customer'

  /api/v1/master/customers/search:
    get:
      summary: Search customers
      tags: [Customer]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_List_Customer'

  /api/v1/master/customers/{id}:
    get:
      summary: Get a customer by ID
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Customer'
    put:
      summary: Update a customer
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Customer'

  /api/v1/master/customers/{id}/status:
    put:
      summary: Update customer status
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_Customer'

  /api/v1/master/customers/{id}/dashboard:
    get:
      summary: Get customer dashboard data
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse_CustomerDashboard'

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Entity ID

  schemas:
    # Basic inputs
    StatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
      required:
        - status

    RegionalInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    AreaInput:
      type: object
      properties:
        regionalId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - regionalId
        - code
        - name

    RouteInput:
      type: object
      properties:
        areaId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      required:
        - areaId
        - code
        - name

    CategoryInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name

    CustomerInput:
      type: object
      properties:
        routeId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address:
          type: string
        contact:
          type: string
      required:
        - routeId
        - categoryId
        - code
        - name

    # Entities
    Regional:
      allOf:
        - $ref: '#/components/schemas/RegionalInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            createdAt:
              type: string
              format: date-time

    Area:
      allOf:
        - $ref: '#/components/schemas/AreaInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            createdAt:
              type: string
              format: date-time

    Route:
      allOf:
        - $ref: '#/components/schemas/RouteInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            createdAt:
              type: string
              format: date-time

    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            createdAt:
              type: string
              format: date-time

    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            createdAt:
              type: string
              format: date-time

    CustomerDashboard:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        totalOrders:
          type: integer
        totalRevenue:
          type: number
        lastOrderDate:
          type: string
          format: date-time

    # Standard Responses
    StandardResponse_Regional:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Regional'
    StandardResponse_List_Regional:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Regional'

    StandardResponse_Area:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Area'
    StandardResponse_List_Area:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Area'

    StandardResponse_Route:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Route'
    StandardResponse_List_Route:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Route'

    StandardResponse_Category:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Category'
    StandardResponse_List_Category:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    StandardResponse_Customer:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/Customer'
    StandardResponse_List_Customer:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'

    StandardResponse_CustomerDashboard:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/CustomerDashboard'
