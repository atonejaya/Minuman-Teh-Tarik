<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - @One Consignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-color) 0%, #E2E8F0 100%);
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 1.5rem;
            background: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: none;
        }
        .login-logo {
            width: 60px;
            height: 60px;
            background: var(--primary);
            color: white;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin: 0 auto 1.5rem auto;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card text-center">
            <div class="login-logo">
                <i class="fa-solid fa-mug-hot"></i>
            </div>
            <h3 class="fw-bold mb-1">@One</h3>
            <p class="text-muted mb-4">Consignment Sales System</p>
            
            <form action="sales_dashboard.html">
                <div class="form-floating mb-3 text-start">
                    <input type="text" class="form-control form-control-custom" id="username" placeholder="Username">
                    <label for="username">Username</label>
                </div>
                <div class="form-floating mb-4 text-start">
                    <input type="password" class="form-control form-control-custom" id="password" placeholder="Password">
                    <label for="password">Password</label>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-3 rounded-xl fw-bold shadow-hover">
                    LOGIN <i class="fa-solid fa-arrow-right ms-2"></i>
                </button>
            </form>
            
            <!-- Quick links for demonstration purposes -->
            <div class="mt-4 pt-3 border-top text-muted small">
                <p class="mb-2">Wireframe Demo Links:</p>
                <a href="sales_dashboard.html" class="text-decoration-none">Login as Sales</a> | 
                <a href="owner_dashboard.html" class="text-decoration-none text-danger">Login as Owner</a>
            </div>
        </div>
    </div>
</body>
</html>
