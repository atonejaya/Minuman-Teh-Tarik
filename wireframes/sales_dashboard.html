<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard - @One</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="mobile-wrapper">
        <div class="top-app-bar">
            <div>
                <p class="text-muted mb-0 small">Selamat Pagi,</p>
                <h1 class="h4">Andi Surya</h1>
            </div>
            <div class="bg-light rounded-circle p-2 px-3">
                <i class="fa-regular fa-bell text-muted"></i>
            </div>
        </div>

        <div class="p-3">
            <!-- Target Hari Ini -->
            <div class="card-custom p-3 mb-3 shadow-hover">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="text-muted fw-semibold">Target Hari Ini</span>
                    <span class="badge bg-primary rounded-pill">15 Warung</span>
                </div>
                <div class="d-flex justify-content-between align-items-end">
                    <div>
                        <h2 class="mb-0 fw-bold">8 <span class="text-muted fs-6 fw-normal">/ 15</span></h2>
                        <small class="text-muted">Sudah Dikunjungi</small>
                    </div>
                    <div class="text-end">
                        <div class="progress" style="width: 100px; height: 8px;">
                            <div class="progress-bar bg-success" role="progressbar" style="width: 53%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <div class="card-custom p-3 text-center shadow-hover h-100">
                        <div class="text-primary mb-2"><i class="fa-solid fa-mug-hot fa-2x"></i></div>
                        <h4 class="fw-bold mb-0">215</h4>
                        <small class="text-muted">Cup Terjual</small>
                    </div>
                </div>
                <div class="col-6">
                    <div class="card-custom p-3 text-center shadow-hover h-100">
                        <div class="text-warning mb-2"><i class="fa-solid fa-wallet fa-2x"></i></div>
                        <h4 class="fw-bold mb-0 fs-5">Rp1.25M</h4>
                        <small class="text-muted">Kas Dibawa</small>
                    </div>
                </div>
                <div class="col-12">
                    <div class="card-custom p-3 text-center shadow-hover">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <div class="bg-light text-info rounded p-2"><i class="fa-solid fa-box-open fa-lg"></i></div>
                                <div class="text-start">
                                    <h5 class="fw-bold mb-0">120 Cup</h5>
                                    <small class="text-muted">Barang Tersisa di Kendaraan</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Big Action Button -->
            <a href="sales_visit_list.html" class="btn btn-primary-custom w-100 py-3 rounded-xl fw-bold shadow-hover fs-5 d-flex justify-content-center align-items-center gap-2">
                <i class="fa-solid fa-play"></i> MULAI VISIT
            </a>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="sales_dashboard.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
            <a href="sales_visit_list.html" class="nav-item">
                <i class="fa-solid fa-store"></i>
                <span>Visit</span>
            </a>
            <a href="sales_setoran.html" class="nav-item">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span>Setoran</span>
            </a>
            <a href="sales_akun.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Akun</span>
            </a>
        </nav>
    </div>
</body>
</html>
